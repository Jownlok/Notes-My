<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/sign_up.css">
</head>
<body>
    <header>
        <h1 class="Titulo1">Sign Up</h1>
        <div class="signupbox">
            <input type="name" placeholder="Name" class="Name">
            <input type="email" placeholder="Email" class="Email">
            <input type="password" placeholder="Password" class="Password">
            <input type="submit" value="Create" class="Create">
        </div>
    </header>
    <article>
        <div class="signbox">
            <div class="signup">
                <h4 style="color: white" class="Titulo3">Dont have an account?</h4>
                <a href="../index.html" class="Titulo3"><h4>Sign In</h4></a>
            </div>
            
        </div>
    </article>
</body>
</html>
