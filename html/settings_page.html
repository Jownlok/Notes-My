<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/settings.css">
</head>
<body>
    <header>
        <h1>Profile</h1>
    </header>
    <article>
        <div class="profile">
            <img src="../images/profile.png" alt="Profile photo" width="120px">
            <h2>Name</h2>
        </div>
        <div class="phone">
            <img src="../images/iphone_off.png" alt="Smartphone icon" width="40" style="margin-left: 32px;">
            <h2>00 0000 - 0000</h2>
        </div>
        <div class="email">
            <img src="../images/email_off.png" alt="Email icon" width="40" style="margin-left: 32px;">
            <h2>NOTESmy@email.com</h2>
        </div>
        <div class="password">
            <img src="../images/hide_off.png" alt="Show password" width="40" style="margin-left: 32px;">
            <h2>Password</h2>
        </div>
        <button>
            <a href="../index.html"><img src="../images/logout.png" alt="Logout icon" width="40"></a>
        </button>
    </article>
    <nav>
        <div class="homeICON">
            <a href="../html/home_page.html"><img src='../images/home_disable.png' width="40"></a>
        </div>
        <div class="settingsICON">
            <a href="../html/settings_page.html"><img src='../images/setting_disable.png' width="40"></a>
        </div>
    </nav>
